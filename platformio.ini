[platformio]
default_envs = rcc6_wdg_serial, heltec_v3_wdg_serial, heltec_v4_wdg_serial, rak4631_wdg_serial, heltec_tracker_wdg_serial

[wdg_common]
framework = arduino
lib_ldf_mode = deep+
lib_ignore =
  ESP32 BLE Arduino
  RTClib
  Melopero RV3028
  CayenneLPP
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
extra_scripts =
  pre:scripts/meshcore_ed25519.py
  post:scripts/package_firmware.py
lib_deps =
  jgromes/RadioLib @ 7.7.1
  MeshCore=https://github.com/meshcore-dev/MeshCore.git#727fc0512ce08bfd7b499e46daa7fca6eeec730d
  rweather/Crypto @ 0.4.0
build_flags =
  -Wno-error=return-type
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_NRF24=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
  -D RADIOLIB_EXCLUDE_LORAWAN=1
  -D RADIOLIB_EXCLUDE_LR11X0=1
  -D RADIOLIB_EXCLUDE_FSK4=1
  -D RADIOLIB_EXCLUDE_PAGER=1
  -D MAX_CONTACTS=12
  -D MAX_CONNECTIONS=1
  -D MESH_DEBUG=0
  -D WDG_SERIAL_ONLY=1
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5

[env:rcc6_wdg_serial]
extends = wdg_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = heltec_rcc6
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
build_flags =
  ${wdg_common.build_flags}
  -D WDG_BOARD_RCC6=1
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D NV3001B_USE_SOFTWARE_SPI=1
  -D NV3001B_USE_FAST_GPIO=1
  -D NV3001B_USE_FRAMEBUFFER=1
  -D NV3001B_USE_INDEXED_FRAMEBUFFER=1
  -D NV3001B_LOGICAL_WIDTH=220
  -D NV3001B_LOGICAL_HEIGHT=128
  -D NV3001B_SCREEN_WIDTH=220
  -D NV3001B_SCREEN_HEIGHT=128
  -D PIN_TFT_SCL=4
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D PIN_TFT_DC=3
  -D PIN_TFT_RST=0
  -D PIN_TFT_EN=2
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=1
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D DISPLAY_ROTATION=0

[env:heltec_v3_wdg_serial]
extends = wdg_common
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
lib_deps =
  ${wdg_common.lib_deps}
  adafruit/Adafruit SSD1306 @ 2.5.15
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_src_filter =
  +<*>
  -<helpers/ui/NV3001BDisplay.cpp>
build_flags =
  ${wdg_common.build_flags}
  -D WDG_BOARD_HELTEC_V3=1
  -D P_LORA_NSS=8
  -D P_LORA_DIO_1=14
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=21
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18

[env:heltec_v4_wdg_serial]
extends = wdg_common
platform = platformio/espressif32@6.11.0
board = heltec_v4
lib_deps =
  ${wdg_common.lib_deps}
  adafruit/Adafruit SSD1306 @ 2.5.15
board_build.partitions = default_16MB.csv
build_src_filter =
  +<*>
  -<helpers/ui/NV3001BDisplay.cpp>
build_flags =
  ${wdg_common.build_flags}
  -I variants/heltec_v4
  -D RADIOLIB_LOW_LEVEL=1
  -D WDG_BOARD_HELTEC_V4=1
  -D P_LORA_NSS=8
  -D P_LORA_DIO_1=14
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=21
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18

[env:rak4631_wdg_serial]
extends = wdg_common
platform = nordicnrf52
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
board = rak4631
upload_protocol = nrfutil
build_src_filter =
  +<*>
  -<helpers/ui/NV3001BDisplay.cpp>
  +<../variants/rak4631/variant.cpp>
build_flags =
  ${wdg_common.build_flags}
  -I variants/rak4631
  -D NRF52_PLATFORM=1
  -D WDG_BOARD_RAK4631=1

[env:heltec_tracker_wdg_serial]
extends = wdg_common
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_src_filter =
  +<*>
  -<helpers/ui/NV3001BDisplay.cpp>
build_flags =
  ${wdg_common.build_flags}
  -D WDG_BOARD_HELTEC_TRACKER=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
