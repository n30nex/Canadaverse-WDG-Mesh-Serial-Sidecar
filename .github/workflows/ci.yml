name: WDG Mesh Sidecar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: rcc6_wdg_serial
            artifact: Canadaverse-WDG-Mesh-Serial-RCC6-app
            extension: bin
          - environment: heltec_v3_wdg_serial
            artifact: Canadaverse-WDG-Mesh-Serial-Heltec-V3-app
            extension: bin
          - environment: heltec_v4_wdg_serial
            artifact: Canadaverse-WDG-Mesh-Serial-Heltec-V4-app
            extension: bin
          - environment: rak4631_wdg_serial
            artifact: Canadaverse-WDG-Mesh-Serial-RAK4631
            extension: hex
          - environment: heltec_tracker_wdg_serial
            artifact: Canadaverse-WDG-Mesh-Serial-Heltec-Tracker-app
            extension: bin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
      - name: Package app image and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.${{ matrix.extension }}" \
            "dist/${{ matrix.artifact }}.${{ matrix.extension }}"
          if [ -f ".pio/build/${{ matrix.environment }}/firmware.zip" ]; then
            cp ".pio/build/${{ matrix.environment }}/firmware.zip" \
              "dist/${{ matrix.artifact }}-nrfutil.zip"
          fi
          if [ -f ".pio/build/${{ matrix.environment }}/firmware-factory.bin" ]; then
            cp ".pio/build/${{ matrix.environment }}/firmware-factory.bin" \
              "dist/${{ matrix.artifact }}-factory.bin"
          fi
          cd dist
          sha256sum "${{ matrix.artifact }}.${{ matrix.extension }}" > SHA256SUMS.txt
          if [ -f "${{ matrix.artifact }}-nrfutil.zip" ]; then
            sha256sum "${{ matrix.artifact }}-nrfutil.zip" >> SHA256SUMS.txt
          fi
          if [ -f "${{ matrix.artifact }}-factory.bin" ]; then
            sha256sum "${{ matrix.artifact }}-factory.bin" >> SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
